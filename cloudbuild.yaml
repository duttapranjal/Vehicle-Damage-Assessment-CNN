steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vehicle-damage-assessment:$COMMIT_SHA'
      - '.'

  # Push to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vehicle-damage-assessment:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vehicle-damage-assessment'
      - '--image=gcr.io/$PROJECT_ID/vehicle-damage-assessment:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--concurrency=1'
      - '--timeout=120'
      - '--set-env-vars=HF_REPO_ID=YOUR_HF_USERNAME/vehicle-damage-models'

images:
  - 'gcr.io/$PROJECT_ID/vehicle-damage-assessment:$COMMIT_SHA'

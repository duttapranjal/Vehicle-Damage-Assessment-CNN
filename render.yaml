services:
  - type: web
    name: vehicle-damage-assessment
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: HF_REPO_ID
  value: "Pranjaldutta129/Vehicle-Damage-Models"
      - key: HF_TOKEN
        sync: false   # set this as a secret in the Render dashboard, not here
      - key: ENABLE_MLFLOW
        value: "false"
      - key: FLASK_SECRET_KEY
        sync: false    # set as secret in Render dashboard    
    healthCheckPath: /
